<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>KassisT</title><style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#172033;--muted:#687086;--line:#e4e7ef;--brand:#3157d5;--ok:#16805b;--warn:#a56700;--danger:#ba3a48;--r:12px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--shadow:0 8px 28px rgba(23,32,51,.08);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--text)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#171d2d;color:#d9dfef;padding:20px 12px;display:flex;flex-direction:column;gap:20px}.brand{font-size:20px;font-weight:800;padding:0 10px;color:#fff}.brand small{display:block;color:#91a0c2;font-size:11px;font-weight:600;margin-top:3px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:inherit;text-align:left;padding:11px 12px;border-radius:9px;font-weight:650}.nav button:hover,.nav button.active{background:#29324a;color:#fff}.side-status{margin-top:auto;padding:12px;border:1px solid #35415e;border-radius:10px;font-size:12px;color:#b7c1d8}.shell{min-width:0}.header{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.page-title{font-size:18px;font-weight:750}.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}main{padding:28px;max-width:1440px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--text);font-weight:650}.btn:hover{border-color:#b8c2db}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--danger)}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:18px}.metric b{display:block;font-size:18px;margin-top:6px}.muted{color:var(--muted)}.notice{padding:10px 12px;background:#fff8e7;border:1px solid #f0d89e;border-radius:9px;color:#745400;font-size:13px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:#eef0f6;color:#515b73}.badge.provisional{background:#fff3d7;color:#8a5b00}.badge.confirmed{background:#e4f6ee;color:#116846}.badge.unavailable{background:#f4e9eb;color:#943542}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}tr.click{cursor:pointer}tr.click:hover{background:#fafbfe}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:650}.field input,.field select,.field textarea{border:1px solid #cfd5e2;border-radius:8px;padding:10px;background:#fff}.field input:focus,.field select:focus,.field textarea:focus,.btn:focus,.nav button:focus{outline:3px solid rgba(49,87,213,.25);outline-offset:2px}.error{color:var(--danger);font-size:12px}.hidden{display:none!important}.empty{padding:42px;text-align:center;color:var(--muted)}.split{display:grid;grid-template-columns:300px 1fr;min-height:560px}.list{border-right:1px solid var(--line)}.list button{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:14px}.list button.active{background:#f1f4ff}.conversation{padding:20px;display:flex;flex-direction:column;gap:16px}.messages{display:grid;gap:10px;flex:1}.msg{max-width:70%;padding:10px 12px;border-radius:10px;background:#eef1f8}.msg.out{justify-self:end;background:#e8eeff}.composer{display:flex;gap:8px}.composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px}.dialog-backdrop{position:fixed;inset:0;background:rgba(14,18,30,.48);display:grid;place-items:center;padding:20px}.dialog{width:min(480px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:var(--shadow)}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow)}@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{padding:10px;flex-direction:row;align-items:center;overflow:auto}.brand{display:none}.nav{display:flex}.nav button{white-space:nowrap}.side-status{display:none}.grid.two,.grid.three,.split{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}.header{padding:0 16px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">KassisT<small>C1 • Desktop</small></div><nav class="nav" aria-label="Navegação principal"><button data-page="dashboard" class="active">Dashboard</button><button data-page="conversations">Conversas</button><button data-page="orders">Pedidos</button><button data-page="products">Produtos</button><button data-page="clients">Clientes</button><button data-page="settings">Configurações</button></nav><div class="side-status"><span class="badge provisional">PROVISIONAL_DATA</span><p>Sem backend conectado neste renderer.</p></div></aside><section class="shell"><header class="header"><div class="page-title" id="page-title">Dashboard</div><div class="status"><span class="dot"></span><span>Integrações: NOT_CONNECTED</span></div></header><main id="main" tabindex="-1"></main></section></div><div id="dialog-root"></div><div id="toast-root"></div><script>
(()=>{const state={page:'dashboard',products:[{id:'p-demo-1',name:'Café expresso',price:5.5},{id:'p-demo-2',name:'Pão de queijo',price:7}],orders:[{id:'o-demo-1',status:'DRAFT',items:[{id:'i1',name:'Café expresso',quantity:2,unit_price:5.5,modifiers:[]}]}],conversations:[{id:'c1',name:'Canal operacional',messages:[{text:'Transport não conectado. Esta conversa é fixture.',out:false}]}],clients:[{id:'cl1',name:'Cliente demonstrativo',identity:'PROVISIONAL'}]};const main=document.querySelector('#main'),title=document.querySelector('#page-title');const pages={dashboard:'Dashboard',products:'Produtos',orders:'Pedidos',conversations:'Conversas',clients:'Clientes',settings:'Configurações'};const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);const total=o=>o.items.reduce((s,i)=>s+i.quantity*i.unit_price,0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){const r=document.querySelector('#toast-root');r.innerHTML='<div class="toast" role="status">'+esc(text)+'</div>';setTimeout(()=>r.innerHTML='',3200)}function dialog(content){document.querySelector('#dialog-root').innerHTML='<div class="dialog-backdrop" role="presentation"><section class="dialog" role="dialog" aria-modal="true">'+content+'</section></div>';document.querySelector('.dialog-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeDialog()};setTimeout(()=>document.querySelector('.dialog button, .dialog input')?.focus(),0)}function closeDialog(){document.querySelector('#dialog-root').innerHTML=''}
function dashboard(){return `<div class="toolbar"><div><p class="muted">Superfície operacional local para C1.</p></div><span class="badge provisional">PROVISIONAL_DATA</span></div><div class="notice">Dados demonstrativos são presentation-only e não representam persistência real.</div><div class="grid three" style="margin-top:16px"><div class="card metric"><span class="muted">Produtos disponíveis</span><b>${state.products.length}</b></div><div class="card metric"><span class="muted">Pedidos em rascunho</span><b>${state.orders.filter(o=>o.status==='DRAFT').length}</b></div><div class="card metric"><span class="muted">Transporte de mensagens</span><b>UNAVAILABLE</b></div></div><div class="grid two" style="margin-top:16px"><section class="card"><h3>Atalhos</h3><p><button class="btn primary" data-go="products">Gerenciar produtos</button> <button class="btn" data-go="orders">Novo pedido</button></p></section><section class="card"><h3>Status da aplicação</h3><p class="muted">Renderer ativo. IPC, persistence e transport não estão conectados.</p><span class="badge unavailable">NOT_CONNECTED</span></section></div>`}
function products(){return `<div class="toolbar"><div><span class="badge provisional">PROVISIONAL_DATA</span><p class="muted">Fixtures locais descartáveis; nenhuma alteração é persistida.</p></div><button class="btn primary" id="new-product">Novo produto</button></div><section class="card"><table><thead><tr><th>Nome</th><th>Preço</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr class="click" data-product="${p.id}"><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>Ver</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhum produto</td></tr>'}</tbody></table></section>`}
function productForm(id){const p=id?state.products.find(x=>x.id===id):null;dialog(`<h2>${p?'Editar produto':'Novo produto'}</h2><p class="muted">Modelo UiProduct • provisional • non-canonical</p><form id="product-form"><div class="field"><label for="pn">Nome</label><input id="pn" value="${p?esc(p.name):''}" required minlength="2"/><div class="error" id="pn-e"></div></div><div class="field"><label for="pp">Preço</label><input id="pp" type="number" min="0.01" step="0.01" value="${p?p.price:''}" required/><div class="error" id="pp-e"></div></div><button class="btn primary" type="submit">Salvar na sessão</button> <button class="btn" type="button" id="cancel">Cancelar</button></form>`);document.querySelector('#cancel').onclick=closeDialog;document.querySelector('#product-form').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#pn').value.trim(),price=Number(document.querySelector('#pp').value);let ok=true;if(name.length<2){document.querySelector('#pn-e').textContent='Informe ao menos 2 caracteres';ok=false}if(!(price>0)){document.querySelector('#pp-e').textContent='Informe um preço maior que zero';ok=false}if(!ok)return;if(p){p.name=name;p.price=price}else state.products.push({id:'p-'+Date.now(),name,price});closeDialog();render();toast('Alteração mantida apenas nesta sessão provisional')};}
function productDetail(id){const p=state.products.find(x=>x.id===id);dialog(`<h2>${esc(p.name)}</h2><p><span class="badge provisional">PROVISIONAL_DATA</span></p><p>Preço: <b>${money(p.price)}</b></p><p class="muted">Não existe contrato aprovado para edição persistente.</p><button class="btn primary" id="edit">Editar na sessão</button> <button class="btn" id="close">Fechar</button>`);document.querySelector('#close').onclick=closeDialog;document.querySelector('#edit').onclick=()=>productForm(id)}
function orders(){return `<div class="toolbar"><div><span class="badge provisional">PROVISIONAL_DATA</span><p class="muted">UiOrder e UiOrderItem são presentation-only.</p></div><button class="btn primary" id="new-order">Criar pedido</button></div><section class="card"><table><thead><tr><th>ID</th><th>Status</th><th>Total apresentado</th></tr></thead><tbody>${state.orders.map(o=>`<tr class="click" data-order="${o.id}"><td>${o.id}</td><td><span class="badge ${o.status==='CONFIRMED'?'confirmed':''}">${o.status}</span></td><td>${money(total(o))}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhum pedido</td></tr>'}</tbody></table></section>`}
function orderDetail(id){const o=state.orders.find(x=>x.id===id);dialog(`<h2>Pedido ${o.id}</h2><p><span class="badge provisional">PROVISIONAL_DATA</span> <span class="badge ${o.status==='CONFIRMED'?'confirmed':''}">${o.status}</span></p><table><thead><tr><th>Item</th><th>Qtd.</th><th>Unitário</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.quantity}</td><td>${money(i.unit_price)}</td></tr>`).join('')}</tbody></table><p><b>Total de apresentação: ${money(total(o))}</b></p>${o.status==='DRAFT'?'<button class="btn" id="add-item">Adicionar item</button> <button class="btn primary" id="confirm">Confirmar pedido</button>':''} <button class="btn" id="close">Fechar</button>`);document.querySelector('#close').onclick=closeDialog;if(o.status==='DRAFT'){document.querySelector('#add-item').onclick=()=>addItem(o);document.querySelector('#confirm').onclick=()=>confirmOrder(o)}}
function addItem(o){dialog(`<h2>Adicionar item</h2><p class="muted">Sem product_id e sem vínculo com contrato canônico.</p><form id="item-form"><div class="field"><label>Nome</label><input id="in" required/></div><div class="field"><label>Quantidade</label><input id="iq" type="number" min="1" value="1" required/></div><div class="field"><label>Preço unitário</label><input id="ip" type="number" min="0.01" step="0.01" required/></div><button class="btn primary">Adicionar</button> <button class="btn" type="button" id="cancel">Cancelar</button></form>`);document.querySelector('#cancel').onclick=()=>orderDetail(o.id);document.querySelector('#item-form').onsubmit=e=>{e.preventDefault();const n=document.querySelector('#in').value.trim(),q=Number(document.querySelector('#iq').value),p=Number(document.querySelector('#ip').value);if(!n||q<1||p<=0)return toast('Revise os campos obrigatórios');o.items.push({id:'i-'+Date.now(),name:n,quantity:q,unit_price:p,modifiers:[]});orderDetail(o.id)}}
function confirmOrder(o){dialog(`<h2>Confirmar pedido?</h2><p>Revise o total apresentado: <b>${money(total(o))}</b>.</p><p class="muted">O renderer não é autoridade sobre lifecycle, totais ou confirmação canônica.</p><button class="btn primary" id="yes">Confirmar visualmente</button> <button class="btn" id="no">Cancelar</button>`);document.querySelector('#no').onclick=()=>orderDetail(o.id);document.querySelector('#yes').onclick=()=>{document.querySelector('#yes').disabled=true;document.querySelector('#yes').textContent='Confirmando…';setTimeout(()=>{o.status='CONFIRMED';closeDialog();render();toast('Pedido movido para CONFIRMED apenas no estado provisional')},500)}}
function newOrder(){const o={id:'o-'+Date.now(),status:'DRAFT',items:[]};state.orders.push(o);orderDetail(o.id)}
function conversations(){return `<div class="toolbar"><div><span class="badge unavailable">UNAVAILABLE</span><p class="muted">Transport real não conectado; envio não será simulado.</p></div></div><section class="card split"><div class="list">${state.conversations.map((c,i)=>`<button class="${i?'':'active'}" data-conversation="${c.id}"><b>${esc(c.name)}</b><br/><small class="muted">FIXTURE • PROVISIONAL</small></button>`).join('')}</div><div class="conversation" id="conversation-view"></div></section>`}
function showConversation(id){const c=state.conversations.find(x=>x.id===id);document.querySelector('#conversation-view').innerHTML=`<h3>${esc(c.name)}</h3><div class="messages">${c.messages.map(m=>`<div class="msg ${m.out?'out':''}">${esc(m.text)}</div>`).join('')}</div><div class="notice">Enviar mensagem requer transport/contrato aprovado.</div><div class="composer"><input aria-label="Mensagem" placeholder="Mensagem não será enviada"/><button class="btn" disabled aria-disabled="true">Enviar • UNAVAILABLE</button></div>`}
function clients(){return `<div class="toolbar"><span class="badge provisional">PROVISIONAL_DATA</span></div><section class="card"><table><thead><tr><th>Nome</th><th>Identidade</th></tr></thead><tbody>${state.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.identity)}</td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:16px">Superfície mínima. CRM e contatos externos não fazem parte deste slice.</div></section>`}
function settings(){return `<div class="grid two"><section class="card"><h3>Configurações</h3><p class="muted">Nenhuma configuração persistente é exposta sem IPC/contrato aprovado.</p><button class="btn" id="theme">Alternar contraste local</button></section><section class="card"><h3>Diagnostics</h3><p>Renderer: <span class="badge confirmed">HEALTHY</span></p><p>IPC: <span class="badge unavailable">UNAVAILABLE</span></p><p>Persistence: <span class="badge unavailable">NOT_CONNECTED</span></p><p>Transport: <span class="badge unavailable">NOT_CONNECTED</span></p><p>Auth: <span class="badge">UNKNOWN</span></p></section><section class="card"><h3>Sobre</h3><p>KassisT Desktop • C1 presentation surface</p><p class="muted">Versão declarada pelo package: 0.1.0</p></section></div>`}
function render(){title.textContent=pages[state.page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));main.innerHTML=({dashboard,products,orders,conversations,clients,settings})[state.page]();main.focus();bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;render()});document.querySelector('#new-product')?.addEventListener('click',()=>productForm());document.querySelectorAll('[data-product]').forEach(r=>r.onclick=()=>productDetail(r.dataset.product));document.querySelector('#new-order')?.addEventListener('click',newOrder);document.querySelectorAll('[data-order]').forEach(r=>r.onclick=()=>orderDetail(r.dataset.order));document.querySelectorAll('[data-conversation]').forEach(b=>b.onclick=()=>showConversation(b.dataset.conversation));document.querySelector('#conversation-view')&&showConversation(state.conversations[0].id);document.querySelector('#theme')?.addEventListener('click',()=>{document.body.style.filter=document.body.style.filter?'':'contrast(1.08)';toast('Preferência visual aplicada apenas nesta sessão')})}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});render();})();
</script></body></html>
