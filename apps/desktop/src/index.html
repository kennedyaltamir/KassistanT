<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#f6f8fc"/>
<title>KassisT</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#172033;color:#dfe6f5;padding:22px 14px;display:flex;flex-direction:column;gap:22px;overflow:hidden}.brand{padding:0 12px}.brand-mark{display:flex;align-items:center;gap:10px;color:#fff;font-size:19px;font-weight:800;letter-spacing:-.02em}.brand-dot{width:10px;height:10px;border-radius:50%;background:#7da0ff;box-shadow:0 0 0 5px rgba(125,160,255,.13)}.brand small{display:block;margin:6px 0 0 20px;color:#93a0b8;font-size:11px}.nav{display:grid;gap:4px;overflow:auto;padding-right:2px}.nav-group{margin:10px 10px 4px;color:#7e8ba4;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.nav button{border:0;background:transparent;color:#cfd8eb;text-align:left;padding:10px 12px;border-radius:10px;font-weight:650;transition:background .16s ease,color .16s ease,transform .16s ease}.nav button:hover{background:#222d43;color:#fff}.nav button.active{background:#2b3b5c;color:#fff;box-shadow:inset 3px 0 0 #8fa9ff}.nav button:active{transform:translateY(1px)}.side-footer{margin-top:auto;border:1px solid #2e3950;border-radius:12px;padding:12px;color:#aeb9cd;background:#1a2539}.side-footer strong{display:block;color:#eef2f8;margin-bottom:4px}.side-footer p{margin:0;font-size:12px;line-height:1.45}
.shell{min-width:0;display:flex;flex-direction:column}.header{position:sticky;top:0;z-index:12;height:70px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 30px}.header-left{min-width:0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.page-title{margin:2px 0 0;font-size:21px;line-height:1.2;letter-spacing:-.02em}.status-line{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;white-space:nowrap}.status-dot{width:8px;height:8px;border-radius:50%;background:#b89443}.status-dot.ok{background:var(--ok)}.status-dot.error{background:var(--danger)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.card-body{padding:20px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.section-title h3{margin:0;font-size:15px}.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:18px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{margin-top:8px;font-size:24px;line-height:1.15;letter-spacing:-.03em;font-weight:800}.stat-note{margin-top:6px;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.01em;background:#edf0f5;color:#59647a}.badge.ok{background:var(--ok-soft);color:#146a4e}.badge.warn{background:var(--warn-soft);color:#835400}.badge.error{background:var(--danger-soft);color:#943241}.badge.info{background:var(--brand-soft);color:#3157b3}.badge.neutral{background:#eff2f6;color:#687387}.badge.provisional{background:#f3ecff;color:#6f4ab1}
.notice{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft);color:var(--muted);font-size:13px;line-height:1.45}.notice.warn{background:var(--warn-soft);border-color:#efdcae;color:#6f530f}.notice.error{background:var(--danger-soft);border-color:#efcfd5;color:#8c303e}.notice strong{color:var(--text)}.notice + .card,.notice + .grid{margin-top:16px}.notice-icon{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.05);flex:0 0 auto;font-weight:900}
.empty-state{padding:48px 24px;text-align:center;color:var(--muted)}.empty-icon{width:46px;height:46px;margin:0 auto 14px;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;background:#fff;font-weight:800;color:#738097}.empty-state h3{margin:0 0 6px;color:var(--text);font-size:16px}.empty-state p{max-width:540px;margin:0 auto 16px;line-height:1.55}.skeleton{border-radius:8px;background:linear-gradient(90deg,#eef1f6 20%,#f8f9fb 34%,#eef1f6 48%);background-size:200% 100%;animation:shimmer 1.25s linear infinite}.skeleton.block{height:74px}@keyframes shimmer{to{background-position:-200% 0}}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.table td{font-size:13px}.table tr:last-child td{border-bottom:0}.row-hover:hover{background:#fafbfe}
.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:750}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd7e4;background:#fff;color:var(--text);border-radius:10px;padding:10px 11px}.field textarea{min-height:110px;resize:vertical}.field small{font-size:11px;color:var(--muted)}.search{position:relative}.search input{padding-left:36px}.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7a879d;font-size:12px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}.split{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:620px}.list-panel{border-right:1px solid var(--line);min-width:0;background:#fff}.list-head{padding:15px;border-bottom:1px solid var(--line)}.conversation-row{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 15px;text-align:left;transition:background .14s ease}.conversation-row:hover{background:#fafbfe}.conversation-row.active{background:#f0f4ff;box-shadow:inset 3px 0 0 var(--brand)}.row-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.row-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-time{font-size:10px;color:var(--muted);white-space:nowrap}.row-preview{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation{display:flex;flex-direction:column;min-width:0;background:#f9fbfe}.conversation-header{padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.messages{display:flex;flex-direction:column;gap:10px;padding:22px;flex:1;overflow:auto;min-height:400px}.msg{max-width:min(70%,620px);align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:0 4px 14px rgba(27,39,65,.04);white-space:pre-wrap;word-break:break-word;line-height:1.45}.msg.out{align-self:flex-end;background:#edf3ff;border-color:#dce6ff}.msg-meta{display:flex;gap:8px;margin-top:5px;font-size:10px;color:var(--muted)}.composer{padding:13px 16px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px}.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:10px 12px}.composer input:disabled{background:#f6f7fa}.conversation-note{padding:0 20px 14px;background:#f9fbfe}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;font-weight:700;white-space:nowrap}.tab.active{border-bottom-color:var(--brand);color:var(--text)}.settings-grid{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:620px}.settings-nav{padding:14px;border-right:1px solid var(--line);background:#fbfcfe}.settings-nav button{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:700}.settings-nav button.active{background:var(--brand-soft);color:#3157b3}.settings-content{padding:20px;min-width:0}.setting-block{padding:18px 0;border-bottom:1px solid var(--line)}.setting-block:first-child{padding-top:0}.setting-block:last-child{border-bottom:0}.setting-block h4{margin:0 0 5px;font-size:14px}.setting-block p{margin:0;color:var(--muted);line-height:1.5}.setting-row{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:12px 0}.setting-row + .setting-row{border-top:1px solid var(--line)}
.wa-qr-frame{display:grid;place-items:center;min-height:280px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}.wa-qr-frame svg{display:block;width:min(320px,100%);height:auto}.wa-qr-loading{color:var(--muted);font-size:13px;text-align:center}
.csv-zone{border:1.5px dashed #cfd7e4;border-radius:13px;padding:28px;text-align:center;background:#fbfcff}.csv-zone.drag{background:#f0f4ff;border-color:#7d9bf0}.csv-zone h3{margin:0 0 6px}.csv-zone p{margin:0 auto 12px;max-width:560px;color:var(--muted);line-height:1.45}.preview{max-height:300px;overflow:auto;margin-top:16px;border:1px solid var(--line);border-radius:12px}.hidden{display:none!important}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;word-break:break-all}.muted{color:var(--muted)}.text-danger{color:var(--danger)}
.dialog-backdrop{position:fixed;inset:0;z-index:40;background:rgba(14,18,30,.5);display:grid;place-items:center;padding:20px}.dialog{width:min(500px,100%);background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(14,18,30,.22);padding:22px}.toast{position:fixed;right:22px;bottom:22px;z-index:50;max-width:360px;background:#1b2436;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:0 14px 28px rgba(14,18,30,.2);font-size:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1100px){.app{grid-template-columns:88px minmax(0,1fr)}.sidebar{padding:18px 10px}.brand-mark span:last-child,.brand small,.nav-group,.nav button .nav-label,.side-footer{display:none}.brand-mark{justify-content:center}.nav button{text-align:center;padding:11px 8px}.split{grid-template-columns:290px minmax(0,1fr)}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:840px){.header{padding:0 18px}.status-line{display:none}main{padding:20px}.grid-2,.grid-3{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.settings-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow:auto}.settings-nav button{width:auto;white-space:nowrap}.split{grid-template-columns:1fr}.list-panel{border-right:0;border-bottom:1px solid var(--line);max-height:330px;overflow:auto}.conversation{min-height:520px}.conversation-header{flex-direction:column}.msg{max-width:88%}}
@media(max-width:560px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px;overflow:auto}.brand{display:none}.nav{display:flex;flex:1;gap:4px;overflow:auto}.nav button{white-space:nowrap}.nav button .nav-label{display:inline}.shell{min-width:0}.header{height:62px}main{padding:14px}.grid-4{grid-template-columns:1fr 1fr}.toolbar{gap:12px}.actions{width:100%}.actions .btn{flex:1}.composer{flex-wrap:wrap}.composer input{width:100%;flex-basis:100%}.csv-zone{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"><span class="brand-dot" aria-hidden="true"></span><span>KassisT</span></div><small>Atendimento para pequenos negócios</small></div>
    <nav class="nav" aria-label="Navegação principal">
      <div class="nav-group">Operação</div>
      <button data-page="dashboard"><span class="nav-label">Dashboard</span></button>
      <button data-page="conversations" class="active"><span class="nav-label">Conversas</span></button>
      <button data-page="assistant"><span class="nav-label">Assistente</span></button>
      <button data-page="broadcasts"><span class="nav-label">Disparos</span></button>
      <button data-page="groups"><span class="nav-label">Grupos</span></button>
      <div class="nav-group">Negócio</div>
      <button data-page="orders"><span class="nav-label">Pedidos</span></button>
      <button data-page="products"><span class="nav-label">Produtos</span></button>
      <button data-page="clients"><span class="nav-label">Clientes</span></button>
      <div class="nav-group">Sistema</div>
      <button data-page="settings"><span class="nav-label">Configurações</span></button>
    </nav>
    <div class="side-footer"><strong id="side-state">Operação local</strong><p id="side-state-note">Conexão e dados reais aparecem somente quando o Gateway fornecer a fonte.</p></div>
  </aside>
  <section class="shell">
    <header class="header">
      <div class="header-left"><div class="eyebrow">KassisT Desktop</div><div class="page-title" id="page-title">Conversas</div></div>
      <div class="status-line"><span class="status-dot" id="header-dot"></span><span id="header-status">Gateway: UNKNOWN • WhatsApp: UNKNOWN</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </section>
</div>
<div id="dialog-root"></div>
<div id="toast-root"></div>
<script src="../node_modules/qrcode-generator/dist/qrcode.js"></script>
<script>
(()=>{
  const GATEWAY='http://127.0.0.1:3210';
  const pages={dashboard:'Dashboard',conversations:'Conversas',assistant:'Assistente',broadcasts:'Disparos',groups:'Grupos',orders:'Pedidos',products:'Produtos',clients:'Clientes',settings:'Configurações'};
  const state={page:'conversations',settingsTab:'general',wa:{health:'UNKNOWN',connection:'UNKNOWN',qr:null,me:null,messageCount:0,messages:[],sse:'DISCONNECTED',loading:false,error:null,selectedJid:null},broadcast:{file:null,headers:[],rows:[]}};
  const main=document.querySelector('#main'), title=document.querySelector('#page-title'), headerStatus=document.querySelector('#header-status'), headerDot=document.querySelector('#header-dot'), sideState=document.querySelector('#side-state'), sideNote=document.querySelector('#side-state-note');
  const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  const fmtTime=ts=>{if(!ts)return '';const d=new Date(Number(ts)*1000);return Number.isNaN(d.getTime())?'':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
  function badge(status){const s=String(status||'UNKNOWN').toUpperCase();const cls=s==='CONNECTED'||s==='HEALTHY'||s==='AVAILABLE'?'ok':s==='ERROR'||s==='UNAVAILABLE'?'error':s==='DEGRADED'||s==='PAIRING'?'warn':'neutral';return `<span class="badge ${cls}">${esc(s)}</span>`}
  function toast(text){const root=document.querySelector('#toast-root');root.innerHTML=`<div class="toast" role="status">${esc(text)}</div>`;setTimeout(()=>{if(root.innerHTML)root.innerHTML=''},3200)}
  function dialog(content){const root=document.querySelector('#dialog-root');root.innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true">${content}</section></div>`;root.querySelector('.dialog-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeDialog()};setTimeout(()=>root.querySelector('button,input,textarea')?.focus(),0)}
  function closeDialog(){document.querySelector('#dialog-root').innerHTML=''}
  function updateChrome(){
    title.textContent=pages[state.page]||state.page;
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
    headerStatus.textContent=`Gateway: ${state.wa.health} • WhatsApp: ${state.wa.connection} • SSE: ${state.wa.sse}`;
    headerDot.className='status-dot'+(state.wa.connection==='CONNECTED'?' ok':state.wa.connection==='ERROR'||state.wa.connection==='UNAVAILABLE'?' error':'');
    sideState.textContent=state.wa.connection==='CONNECTED'?'WhatsApp conectado':'Operação local';
    sideNote.textContent=state.wa.connection==='CONNECTED'?'Fonte real conectada pelo Gateway.':'Sem conexão confirmada; estados indisponíveis permanecem explícitos.';
  }
  function mergeMessage(message){if(!message||typeof message!=='object'||!message.id)return false;const id=String(message.id);const idx=state.wa.messages.findIndex(m=>String(m.id)===id);if(idx>=0){state.wa.messages[idx]={...state.wa.messages[idx],...message};return false}state.wa.messages.push({...message,id});state.wa.messages.sort((a,b)=>Number(a.timestamp||0)-Number(b.timestamp||0));if(state.wa.messages.length>500)state.wa.messages=state.wa.messages.slice(-500);return true}
  function applyStatus(x){if(!x||typeof x!=='object')throw new Error('Status inválido');state.wa.connection=typeof x.connection==='string'?x.connection:'UNKNOWN';state.wa.qr=x.qr??null;state.wa.me=x.me??null;state.wa.lastError=x.lastError??null;state.wa.error=x.lastError??null;state.wa.messageCount=Number.isFinite(Number(x.messageCount))?Number(x.messageCount):0;updateChrome()}
  async function gatewayJson(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const r=await fetch(GATEWAY+path,{...options,signal:controller.signal,headers:{'content-type':'application/json',...(options.headers||{})}});const payload=await r.json().catch(()=>{throw new Error('Resposta inválida do Gateway')});if(!r.ok)throw new Error(typeof payload.error==='string'?payload.error:`Falha HTTP ${r.status}`);return payload}finally{clearTimeout(timer)}}
  let eventSource=null,reconnectTimer=null,reconnectAttempt=0,refreshInFlight=false;
  function scheduleEvents(){if(reconnectTimer)return;const delay=Math.min(30000,1000*Math.pow(2,reconnectAttempt));reconnectAttempt=Math.min(reconnectAttempt+1,5);reconnectTimer=setTimeout(()=>{reconnectTimer=null;connectEvents()},delay)}
  function connectEvents(){if(eventSource||state.wa.sse==='CONNECTING')return;state.wa.sse='CONNECTING';updateChrome();eventSource=new EventSource(GATEWAY+'/api/whatsapp/events');eventSource.onopen=()=>{reconnectAttempt=0;state.wa.sse='CONNECTED';updateChrome();render()};eventSource.onerror=()=>{state.wa.sse='DISCONNECTED';if(eventSource){eventSource.close();eventSource=null}updateChrome();scheduleEvents();render()};for(const name of ['status','connection','message'])eventSource.addEventListener(name,event=>{try{const payload=JSON.parse(event.data||'{}');if(payload.status)applyStatus(payload.status);if(name==='message'){const accepted=mergeMessage(payload.message??payload);if(accepted)render()}else render()}catch(error){state.wa.error=error instanceof Error?error.message:'Evento inválido';render()}})}
  async function refreshWhatsApp(){if(refreshInFlight)return;refreshInFlight=true;state.wa.loading=true;state.wa.error=null;render();try{const health=await gatewayJson('/health');state.wa.health=health&&health.status==='ok'?'HEALTHY':'UNKNOWN';applyStatus(await gatewayJson('/api/whatsapp/status'));const history=await gatewayJson('/api/whatsapp/messages?limit=500');state.wa.messages=[];for(const message of Array.isArray(history.messages)?history.messages:[])mergeMessage(message);if(!state.wa.selectedJid)state.wa.selectedJid=buildConversations()[0]?.jid??null}catch(error){state.wa.health='UNAVAILABLE';state.wa.connection='UNAVAILABLE';state.wa.error=error instanceof Error?error.message:'Gateway indisponível'}finally{state.wa.loading=false;refreshInFlight=false;updateChrome();render()}}
  function buildConversations(){const map=new Map();for(const m of state.wa.messages){const jid=typeof m.jid==='string'?m.jid:null;if(!jid)continue;const current=map.get(jid);if(!current||Number(m.timestamp||0)>=Number(current.timestamp||0))map.set(jid,{jid,...m})}return [...map.values()].sort((a,b)=>Number(b.timestamp||0)-Number(a.timestamp||0))}
  function jidLabel(jid){if(!jid)return 'Identidade indisponível';if(jid.endsWith('@lid'))return 'LID • '+jid.slice(0,-4);if(jid.endsWith('@s.whatsapp.net'))return jid.slice(0,-13);return jid}
  function selectedConversation(){return state.wa.selectedJid?buildConversations().find(c=>c.jid===state.wa.selectedJid)||null:null}
  function statusNotice(label,status,description){return `<div class="notice ${status==='UNAVAILABLE'||status==='ERROR'?'error':status==='DEGRADED'?'warn':''}"><div class="notice-icon">•</div><div><strong>${esc(label)} ${badge(status)}</strong><div>${esc(description)}</div></div></div>`}
  function dashboard(){const c=state.wa.connection;return `<div class="toolbar"><div><h2>Visão geral</h2><p class="muted">O que está operacional agora, sem métricas fabricadas.</p></div><div class="actions"><button class="btn primary" data-go="conversations">Abrir conversas</button></div></div><div class="grid grid-4"><div class="card stat"><div class="stat-label">WhatsApp</div><div class="stat-value">${esc(c)}</div><div class="stat-note">Fonte: Gateway real</div></div><div class="card stat"><div class="stat-label">Gateway</div><div class="stat-value">${esc(state.wa.health)}</div><div class="stat-note">Health endpoint</div></div><div class="card stat"><div class="stat-label">SSE</div><div class="stat-value">${esc(state.wa.sse)}</div><div class="stat-note">Eventos em tempo real</div></div><div class="card stat"><div class="stat-label">Conversas</div><div class="stat-value">${buildConversations().length}</div><div class="stat-note">Somente mensagens disponíveis</div></div></div><div style="margin-top:16px" class="grid grid-2"><section class="card"><div class="card-body"><div class="section-title"><h3>Estado operacional</h3>${badge(c)}</div><p class="muted">O Dashboard exibe somente sinais derivados de fontes existentes. Identidade, entrega e CRM não são inferidos quando ausentes.</p></div></section><section class="card"><div class="card-body"><div class="section-title"><h3>Próxima ação</h3>${badge(c==='CONNECTED'?'AVAILABLE':'UNAVAILABLE')}</div><p class="muted">${c==='CONNECTED'?'Você pode revisar conversas e enviar mensagens pelo Gateway.':'Conecte o WhatsApp para habilitar a experiência operacional real.'}</p><button class="btn ${c==='CONNECTED'?'':'primary'}" data-go="conversations">${c==='CONNECTED'?'Revisar conversas':'Configurar conexão'}</button></div></section></div>`}
  function conversations(){const wa=state.wa,convs=buildConversations(),selected=selectedConversation(),msgs=selected?wa.messages.filter(m=>m.jid===selected.jid):[],canSend=wa.connection==='CONNECTED'&&!!selected?.jid;const connectionNotice=wa.connection!=='CONNECTED'?`<section class="card" style="margin-bottom:16px"><div class="card-body"><div class="section-title"><div><h3>WhatsApp ${esc(wa.connection)}</h3><p class="muted">Configure a conexão em Configurações → WhatsApp / Conexão.</p></div>${badge(wa.connection)}</div><button class="btn primary" id="wa-open-connection-settings">Abrir configuração</button></div></section>`:'';return `<div class="toolbar"><div><h2>Conversas</h2><p class="muted">Mensagens reais recebidas do Gateway. WhatsApp é o canal contextual.</p></div><div class="actions"><button class="btn" id="wa-refresh">Atualizar</button></div></div>${connectionNotice}${wa.error?statusNotice('Gateway','ERROR',wa.error):''}<section class="card" style="padding:0;overflow:hidden"><div class="split"><aside class="list-panel" aria-label="Lista de conversas"><div class="list-head"><div class="row-top"><strong>Conversas</strong><span class="badge neutral">${convs.length}</span></div><p class="muted" style="margin:6px 0 0">${wa.loading?'Atualizando histórico…':'Derivadas exclusivamente das mensagens disponíveis.'}</p></div>${wa.loading?'<div style="padding:15px;display:grid;gap:8px"><div class="skeleton block"></div><div class="skeleton block"></div><div class="skeleton block"></div></div>':convs.length?convs.map(c=>`<button class="conversation-row ${c.jid===wa.selectedJid?'active':''}" data-jid="${esc(c.jid)}"><div class="row-top"><span class="row-name">${esc(jidLabel(c.jid))}</span><span class="row-time">${esc(fmtTime(c.timestamp))}</span></div><div class="row-preview">${esc(c.text??'[mensagem sem texto]')}</div></button>`).join(''):`<div class="empty-state"><div class="empty-icon">○</div><h3>Nenhuma conversa disponível</h3><p>O Gateway ainda não forneceu mensagens suficientes para montar uma conversa.</p><button class="btn" id="wa-refresh-empty">Atualizar</button></div>`}</aside><section class="conversation"><header class="conversation-header"><div><strong>${esc(selected?jidLabel(selected.jid):'Nenhuma conversa selecionada')}</strong><div class="muted mono" style="margin-top:4px">${esc(selected?.jid||'')}</div></div><div class="kpis">${badge(selected?'REAL':'UNKNOWN')}${selected?.direction?badge(selected.direction):''}</div></header><div class="messages">${msgs.length?msgs.map(m=>`<div class="msg ${m.direction==='OUTBOUND'?'out':''}"><div>${esc(m.text??'[mensagem sem texto suportado]')}</div><div class="msg-meta"><span>${esc(m.direction||'UNKNOWN')}</span><span>${esc(m.status||'UNKNOWN')}</span><span>${esc(fmtTime(m.timestamp))}</span></div></div>`).join(''):`<div class="empty-state"><div class="empty-icon">✦</div><h3>${selected?'Nenhuma mensagem disponível':'Selecione uma conversa'}</h3><p>${selected?'A conversa existe na fonte real, mas não há mensagens legíveis para exibir.':'Escolha uma conversa real na lista para visualizar o histórico.'}</p></div>`}</div><div class="conversation-note">${statusNotice('Estado de entrega','UNKNOWN','Delivery/read permanecem desconhecidos quando o Gateway não fornece essa informação. @lid é exibido como LID e não é convertido em telefone.')}</div><form class="composer" id="wa-composer"><input id="wa-text" aria-label="Mensagem" placeholder="Escreva uma mensagem…" autocomplete="off" ${canSend?'':'disabled'} /><button class="btn primary" type="submit" ${canSend?'':'disabled'}>${canSend?'Enviar':'Enviar indisponível'}</button></form></section></div></section><section class="card" style="margin-top:16px"><div class="card-body"><div class="section-title"><h3>Diagnósticos</h3><span class="badge neutral">PROVENANCE</span></div><div class="grid grid-4"><div><div class="muted">Gateway</div><strong>${esc(wa.health)}</strong></div><div><div class="muted">WhatsApp</div><strong>${esc(wa.connection)}</strong></div><div><div class="muted">SSE</div><strong>${esc(wa.sse)}</strong></div><div><div class="muted">Mensagens em memória</div><strong>${wa.messageCount}</strong></div></div></div></section>`}
  function assistant(){return `<div class="toolbar"><div><h2>Assistente</h2><p class="muted">Status da IA e disponibilidade conforme fontes reais expostas pelo runtime.</p></div></div><div class="grid grid-3"><section class="card stat"><div class="stat-label">Status da IA</div><div class="stat-value">UNKNOWN</div><div class="stat-note">Fonte específica não exposta nesta superfície.</div></section><section class="card stat"><div class="stat-label">Modelo / profile</div><div class="stat-value">UNAVAILABLE</div><div class="stat-note">Nenhum contrato de UI disponível para inferir seleção.</div></section><section class="card stat"><div class="stat-label">Proveniência</div><div class="stat-value">AVAILABLE</div><div class="stat-note">Diagnósticos só aparecem quando o runtime os fornece.</div></section></div><div style="margin-top:16px">${statusNotice('Assistente','UNKNOWN','A tela está preparada para consumir status real. Não exibe um modelo fictício nem cria AssistantConfig.')}</div>`}
  function groups(){return `<div class="toolbar"><div><h2>Grupos</h2><p class="muted">Busca e filtros ficam preparados para uma fonte real de grupos.</p></div></div><section class="card"><div class="card-body"><div class="grid grid-2"><div class="field"><label for="group-search">Buscar grupo</label><input id="group-search" placeholder="Nome ou identificador" disabled></div><div class="field"><label for="group-filter">Filtro</label><select id="group-filter" disabled><option>Todos</option></select></div></div></div><div class="empty-state">${statusNotice('Grupos','UNAVAILABLE','Nenhum contrato de leitura de grupos está disponível nesta baseline. Nenhum grupo será fabricado na interface.')}</div></section>`}
  function broadcasts(){return `<div class="toolbar"><div><h2>Disparos</h2><p class="muted">Prepare um CSV e valide o conteúdo localmente. O envio em massa permanece indisponível sem backend autorizado.</p></div><span class="badge warn">ENVIO UNAVAILABLE</span></div><section class="card"><div class="card-body"><div class="csv-zone" id="csv-zone"><h3>Importar CSV</h3><p>O arquivo é lido somente no renderer para preview. Nada é enviado automaticamente.</p><input id="csv-file" class="sr-only" type="file" accept=".csv,text/csv"><button class="btn primary" id="csv-pick">Selecionar CSV</button></div><div id="csv-preview" class="preview hidden"></div></div></section><section class="card" style="margin-top:16px"><div class="card-body"><div class="section-title"><h3>Estado do disparo</h3>${badge('UNAVAILABLE')}</div><p class="muted">Histórico real, scheduling e envio não são simulados. Quando uma fonte for conectada, esta superfície pode exibir preview, estado e histórico reais.</p></div></section>`}
  function genericUnavailable(name,desc){return `<div class="toolbar"><div><h2>${esc(name)}</h2><p class="muted">${esc(desc)}</p></div></div><section class="card"><div class="empty-state">${statusNotice(name,'UNAVAILABLE','A fonte operacional necessária ainda não está disponível nesta baseline. A interface mantém o estado explícito em vez de criar dados de demonstração.')}</div></section>`}
  const orders=()=>genericUnavailable('Pedidos','A visão de pedidos aguarda uma fonte de dados de negócio autorizada.');
  const products=()=>genericUnavailable('Produtos','A visão de produtos aguarda uma fonte de catálogo autorizada.');
  const clients=()=>genericUnavailable('Clientes','A visão de clientes aguarda integração de dados autorizada.');
  function settings(){const tabs=[['general','Geral'],['whatsapp','WhatsApp / Conexão'],['assistant','Assistente / IA'],['notifications','Notificações'],['team','Equipe / Operação'],['diagnostics','Diagnósticos'],['privacy','Privacidade / Dados'],['about','Sobre / Sistema']];const active=state.settingsTab;const c=String(state.wa.connection||'UNKNOWN').toUpperCase();const whatsapp=c==='DISCONNECTED'?`<div class="setting-block"><div class="section-title"><div><h4>WhatsApp desconectado</h4><p class="muted">Conecte o WhatsApp pelo Gateway para iniciar o vínculo.</p></div>${badge('DISCONNECTED')}</div><div class="actions"><button class="btn primary" id="wa-settings-connect">Conectar WhatsApp</button><button class="btn" id="wa-settings-refresh">Atualizar</button></div></div>`:c==='CONNECTING'?`<div class="setting-block"><div class="section-title"><div><h4>Conectando ao WhatsApp...</h4><p class="muted">O Gateway está iniciando a sessão. Aguarde o próximo estado.</p></div>${badge('CONNECTING')}</div><div class="actions"><button class="btn" id="wa-settings-refresh">Atualizar</button></div></div>`:c==='PAIRING'?`<div class="setting-block"><div class="section-title"><div><h4>Vincule seu WhatsApp</h4><p class="muted">Use o aplicativo do WhatsApp para escanear o QR Code.</p></div>${badge('PAIRING')}</div><div id="wa-qr" class="wa-qr-frame" aria-live="polite"><div class="wa-qr-loading">Preparando QR Code…</div></div><ol style="margin:16px 0 0;padding-left:22px;line-height:1.7;color:var(--muted)"><li>Abra o WhatsApp no celular.</li><li>Vá em Dispositivos conectados.</li><li>Escolha Vincular dispositivo.</li><li>Escaneie o QR Code exibido pelo KassisT.</li></ol><div class="actions" style="margin-top:16px"><button class="btn" id="wa-settings-refresh">Atualizar</button></div></div>`:c==='CONNECTED'?`<div class="setting-block"><div class="section-title"><div><h4>WhatsApp conectado</h4><p class="muted">A identidade abaixo é exibida somente quando fornecida pelo Gateway.</p></div>${badge('CONNECTED')}</div><div class="setting-row"><span>Nome</span><strong>${state.wa.me?.name?esc(state.wa.me.name):'Indisponível'}</strong></div><div class="setting-row"><span>ID / JID</span><strong class="mono">${state.wa.me?.id?esc(state.wa.me.id):'Indisponível'}</strong></div><div class="actions" style="margin-top:16px"><button class="btn" id="wa-settings-disconnect">Desconectar</button><button class="btn primary" id="wa-settings-reconnect">Reconectar</button><button class="btn danger" id="wa-settings-reset">Resetar sessão</button><button class="btn" id="wa-settings-refresh">Atualizar</button></div></div>`:c==='ERROR'?`<div class="setting-block"><div class="section-title"><div><h4>Falha na conexão</h4><p class="muted">O Gateway informou uma falha na sessão do WhatsApp.</p></div>${badge('ERROR')}</div><div class="notice error"><div class="notice-icon">!</div><div><strong>Erro reportado pelo Gateway</strong><div>${esc(state.wa.error||'Falha na conexão')}</div></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="wa-settings-connect">Tentar novamente</button><button class="btn danger" id="wa-settings-reset">Resetar sessão</button><button class="btn" id="wa-settings-refresh">Atualizar</button></div></div>`:statusNotice('WhatsApp',c,'Estado atual fornecido pelo Gateway.');const content={general:`<div class="setting-block"><h4>Experiência</h4><p>A interface prioriza clareza, estados honestos e acesso por teclado.</p></div><div class="setting-block"><h4>Estado local</h4><p>Preferências não persistentes nesta baseline são mantidas somente durante a sessão.</p></div>`,whatsapp:whatsapp,assistant:`<div class="setting-block"><h4>Assistente</h4><p>Status/modelo ficam <strong>UNKNOWN/UNAVAILABLE</strong> até que a fonte real seja exposta pelo runtime.</p></div>`,notifications:statusNotice('Notificações','UNAVAILABLE','Nenhum contrato de preferências de notificação é exposto nesta baseline.'),team:statusNotice('Equipe / Operação','UNAVAILABLE','Gestão de equipe e permissões não está implementada nesta superfície.'),diagnostics:`<div class="setting-block"><h4>Proveniência</h4><p class="mono">Gateway=${esc(state.wa.health)}<br>WhatsApp=${esc(state.wa.connection)}<br>SSE=${esc(state.wa.sse)}</p></div>`,privacy:statusNotice('Privacidade / Dados','UNAVAILABLE','Controles persistentes de retenção e dados ainda não estão expostos pelo contrato desta baseline.'),about:`<div class="setting-block"><h4>KassisT Desktop</h4><p>Experiência local-first para operação de atendimento. Versão do pacote: 0.1.0.</p></div>`}[active];return `<div class="toolbar"><div><h2>Configurações</h2><p class="muted">Organização preparada para os contratos que já existirem.</p></div></div><section class="card" style="overflow:hidden"><div class="settings-grid"><nav class="settings-nav" aria-label="Seções de configurações">${tabs.map(([id,label])=>`<button class="${id===active?'active':''}" data-setting-tab="${id}">${esc(label)}</button>`).join('')}</nav><section class="settings-content">${content||''}</section></div></section>`}
  function bindCSV(){const input=document.querySelector('#csv-file'),pick=document.querySelector('#csv-pick'),zone=document.querySelector('#csv-zone'),preview=document.querySelector('#csv-preview');if(!input)return;pick.addEventListener('click',()=>input.click());for(const ev of ['dragenter','dragover'])zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('drag')});for(const ev of ['dragleave','drop'])zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('drag')});zone.addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(f)loadCSV(f)});input.addEventListener('change',()=>{const f=input.files?.[0];if(f)loadCSV(f)});function loadCSV(file){const reader=new FileReader();reader.onload=()=>{const text=String(reader.result||'');const lines=text.split(/\r?\n/).filter(Boolean);const rows=lines.slice(0,8).map(line=>line.split(',').map(x=>x.trim()));if(!rows.length)return;const headers=rows[0];state.broadcast.file=file.name;state.broadcast.headers=headers;state.broadcast.rows=rows.slice(1);preview.classList.remove('hidden');preview.innerHTML=`<div class="card-body"><div class="section-title"><h3>Preview: ${esc(file.name)}</h3><span class="badge info">${state.broadcast.rows.length} linhas carregadas</span></div><div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${state.broadcast.rows.slice(0,5).map(row=>`<tr>${headers.map((_,i)=>`<td>${esc(row[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted" style="margin:12px 0 0">Preview local limitado às primeiras linhas. Nenhuma chamada de envio foi feita.</p></div>`};reader.readAsText(file)}}
  function bindConversations(){document.querySelector('#wa-refresh')?.addEventListener('click',refreshWhatsApp);document.querySelector('#wa-refresh-empty')?.addEventListener('click',refreshWhatsApp);document.querySelector('#wa-open-connection-settings')?.addEventListener('click',()=>{state.page='settings';state.settingsTab='whatsapp';render()});document.querySelectorAll('[data-jid]').forEach(b=>b.addEventListener('click',()=>{state.wa.selectedJid=b.dataset.jid||null;render();setTimeout(()=>document.querySelector('.messages')?.scrollTo(0,999999),0)}));document.querySelector('#wa-composer')?.addEventListener('submit',async e=>{e.preventDefault();const input=document.querySelector('#wa-text'),text=input?.value?.trim()||'',selected=selectedConversation();if(!text||!selected?.jid||state.wa.connection!=='CONNECTED')return;const button=e.submitter;button.disabled=true;try{await gatewayJson('/api/whatsapp/messages',{method:'POST',body:JSON.stringify({to:selected.jid,text})});input.value='';toast('Mensagem aceita pelo Gateway; aguardando evento SSE.')}catch(err){state.wa.error=err instanceof Error?err.message:'Falha no envio';toast(state.wa.error)}finally{button.disabled=false;render()}})}
  function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.go;render();if(state.page==='conversations'){connectEvents();refreshWhatsApp()}}));document.querySelectorAll('[data-setting-tab]').forEach(b=>b.addEventListener('click',()=>{state.settingsTab=b.dataset.settingTab;render()}));if(state.page==='settings'&&state.settingsTab==='whatsapp'){document.querySelector('#wa-settings-refresh')?.addEventListener('click',()=>{connectEvents();refreshWhatsApp()});for(const selector of ['#wa-settings-connect','#wa-settings-reconnect'])document.querySelector(selector)?.addEventListener('click',async()=>{state.wa.connection='CONNECTING';state.wa.qr=null;state.wa.error=null;render();try{await gatewayJson('/api/whatsapp/connect',{method:'POST',body:'{}'});await refreshWhatsApp()}catch(error){state.wa.connection='ERROR';state.wa.error=error instanceof Error?error.message:'Falha ao conectar';render()}});document.querySelector('#wa-settings-disconnect')?.addEventListener('click',async()=>{state.wa.error=null;try{await gatewayJson('/api/whatsapp/logout',{method:'POST',body:'{}'});toast('Logout solicitado ao Gateway.');await refreshWhatsApp()}catch(error){state.wa.connection='ERROR';state.wa.error=error instanceof Error?error.message:'Falha no logout';render()}});document.querySelector('#wa-settings-reset')?.addEventListener('click',async()=>{state.wa.error=null;const confirmed=window.confirm('Resetar sessão?\n\nA sessão WhatsApp armazenada pelo KassisT será removida.\nUm novo QR Code poderá ser necessário.');if(!confirmed)return;try{await gatewayJson('/api/whatsapp/reset-session',{method:'POST',body:'{}'});toast('Sessão resetada no Gateway.');await refreshWhatsApp()}catch(error){state.wa.connection='ERROR';state.wa.error=error instanceof Error?error.message:'Falha ao resetar';render()}});if(state.wa.connection==='PAIRING'&&state.wa.qr){const target=document.querySelector('#wa-qr');if(target&&typeof qrcode==='function'){try{const qr=qrcode(0,'M');qr.addData(String(state.wa.qr));qr.make();target.innerHTML=qr.createSvgTag({cellSize:6,margin:18,scalable:true});const svg=target.querySelector('svg');if(svg){svg.setAttribute('role','img');svg.setAttribute('aria-label','QR Code para vincular o WhatsApp');svg.setAttribute('focusable','false')}}catch(error){target.innerHTML='<div class="wa-qr-loading">Não foi possível gerar o QR Code.</div>'}}}}if(state.page==='conversations')bindConversations();if(state.page==='broadcasts')bindCSV()}
  function render(){updateChrome();const renderer={dashboard,conversations,assistant,broadcasts,groups,orders,products,clients,settings}[state.page]||dashboard;main.innerHTML=renderer();main.focus();bind()}
  document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{state.page=button.dataset.page;render();if(state.page==='conversations'){connectEvents();refreshWhatsApp()}}));
  connectEvents();refreshWhatsApp();render();
})();
</script>
</body>
</html>
