<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; connect-src 'self' http://127.0.0.1:3210" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KassisT</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#172033;--muted:#687086;--line:#e4e7ef;--brand:#3157d5;--ok:#16805b;--warn:#a56700;--danger:#ba3a48;--r:12px;--shadow:0 8px 28px rgba(23,32,51,.08);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#171d2d;color:#d9dfef;padding:20px 12px;display:flex;flex-direction:column;gap:20px}.brand{font-size:20px;font-weight:800;padding:0 10px;color:#fff}.brand small{display:block;color:#91a0c2;font-size:11px;font-weight:600;margin-top:3px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:inherit;text-align:left;padding:11px 12px;border-radius:9px;font-weight:650}.nav button:hover,.nav button.active{background:#29324a;color:#fff}.side-status{margin-top:auto;padding:12px;border:1px solid #35415e;border-radius:10px;font-size:12px;color:#b7c1d8}.shell{min-width:0}.header{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.page-title{font-size:18px;font-weight:750}.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}main{padding:28px;max-width:1440px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--text);font-weight:650}.btn:hover{border-color:#b8c2db}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{padding:18px}.metric b{display:block;font-size:18px;margin-top:6px}.muted{color:var(--muted)}.notice{padding:12px 14px;background:#fff8e7;border:1px solid #f0d89e;border-radius:9px;color:#745400;font-size:13px}.notice.error{background:#fff1f3;border-color:#edc4ca;color:#943542}.notice.info{background:#f4f7ff;border-color:#dbe3ff;color:#3552a0}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:#eef0f6;color:#515b73}.badge.provisional{background:#fff3d7;color:#8a5b00}.badge.confirmed{background:#e4f6ee;color:#116846}.badge.unavailable{background:#f4e9eb;color:#943542}.badge.unknown{background:#eef0f6;color:#515b73}.badge.degraded{background:#fff4dd;color:#8a5b00}.badge.ready{background:#e4f6ee;color:#116846}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}tr.click{cursor:pointer}tr.click:hover{background:#fafbfe}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:650}.field input,.field select,.field textarea{border:1px solid #cfd5e2;border-radius:8px;padding:10px;background:#fff}.field input:focus,.field select:focus,.field textarea:focus,.btn:focus,.nav button:focus,.tab-button:focus{outline:3px solid rgba(49,87,213,.25);outline-offset:2px}.error{color:var(--danger);font-size:12px}.empty{padding:42px;text-align:center;color:var(--muted)}.split{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:600px}.list{border-right:1px solid var(--line);background:#fff}.list-header{padding:16px;border-bottom:1px solid var(--line)}.conversation-row{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:14px}.conversation-row.active{background:#f1f4ff}.conversation-row:hover{background:#fafbfe}.row-top{display:flex;justify-content:space-between;gap:8px}.row-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-time{font-size:11px;color:var(--muted);white-space:nowrap}.row-preview{margin-top:6px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation{padding:0;display:flex;flex-direction:column;min-width:0}.conversation-header{padding:16px 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.messages{display:flex;flex-direction:column;gap:10px;padding:20px;flex:1;overflow:auto;min-height:400px}.msg{max-width:70%;padding:10px 12px;border-radius:10px;background:#eef1f8;white-space:pre-wrap;word-break:break-word}.msg.out{align-self:flex-end;background:#e8eeff}.msg-meta{display:flex;gap:8px;margin-top:5px;font-size:10px;color:var(--muted)}.composer{padding:14px 20px;border-top:1px solid var(--line);background:#fff;display:flex;gap:8px}.composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px}.composer input:disabled{background:#f7f8fb}.dialog-backdrop{position:fixed;inset:0;background:rgba(14,18,30,.48);display:grid;place-items:center;padding:20px}.dialog{width:min(480px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:var(--shadow)}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:20}.inline-status{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;word-break:break-all}.diagnostic-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.diagnostic{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.qr{width:100%;min-height:120px;background:#171d2d;color:#fff;border:0;border-radius:9px;padding:14px;resize:vertical}.workspace-note{padding:12px 14px;border:1px dashed #cfd5e2;border-radius:10px;color:var(--muted);background:#fbfcff}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.section-title h2,.section-title h3{margin:0}.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.state-card{display:grid;gap:8px}.state-card strong{font-size:16px}.tab-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tab-button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;color:var(--text);font-weight:650}.tab-button[aria-selected="true"]{background:#eef2ff;border-color:#cfd8ff;color:#294bb5}.settings-content{min-height:360px}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.checklist{display:grid;gap:10px}.check{display:flex;gap:10px;align-items:flex-start}.check input{margin-top:3px}.small{font-size:12px}.hero-empty{min-height:260px;display:grid;place-items:center;text-align:center}.hero-empty strong{font-size:17px;display:block;margin-bottom:8px}.status-legend{display:flex;gap:8px;flex-wrap:wrap}.list-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list-filter input{min-width:220px;border:1px solid var(--line);border-radius:8px;padding:9px 10px}.danger-text{color:var(--danger)}@media(max-width:1050px){.kpi-grid,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:920px){.app{grid-template-columns:1fr}.sidebar{padding:10px;flex-direction:row;align-items:center;overflow:auto}.brand{display:none}.nav{display:flex}.nav button{white-space:nowrap}.side-status{display:none}.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}.split{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--line)}.diagnostic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}.header{padding:0 16px}}@media(max-width:620px){.diagnostic-grid,.kpi-grid{grid-template-columns:1fr}.conversation-header{flex-direction:column}.composer{flex-wrap:wrap}.composer input{min-width:180px}.msg{max-width:88%}.status{white-space:normal;text-align:right}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">KassisT<small>C1 • Desktop</small></div>
    <nav class="nav" aria-label="Navegação principal">
      <button data-page="dashboard">Dashboard</button>
      <button data-page="whatsapp" class="active">Conversas</button>
      <button data-page="assistant">Assistente</button>
      <button data-page="broadcasts">Disparos</button>
      <button data-page="groups">Grupos</button>
      <button data-page="orders">Pedidos</button>
      <button data-page="products">Produtos</button>
      <button data-page="clients">Clientes</button>
      <button data-page="settings">Configurações</button>
    </nav>
    <div class="side-status" id="side-wa-status">WhatsApp: UNKNOWN</div>
  </aside>
  <section class="shell">
    <header class="header">
      <div class="page-title" id="page-title">Conversas</div>
      <div class="status"><span class="dot" id="header-dot"></span><span id="header-status">Gateway: UNKNOWN • WhatsApp: UNKNOWN • SSE: DISCONNECTED</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </section>
</div>
<div id="dialog-root"></div>
<div id="toast-root"></div>
<script>
(()=>{
  const GATEWAY='http://127.0.0.1:3210';
  const pages={dashboard:'Dashboard',whatsapp:'Conversas',assistant:'Assistente',broadcasts:'Disparos',groups:'Grupos',orders:'Pedidos',products:'Produtos',clients:'Clientes',settings:'Configurações'};
  const settingsSections=['Geral','WhatsApp','Assistente IA','Operação','Segurança','Dados e Privacidade','Diagnóstico','Sobre'];
  const state={
    page:'whatsapp',settingsSection:'Geral',groupFilter:'',
    products:[{id:'p-demo-1',name:'Café expresso',price:5.5},{id:'p-demo-2',name:'Pão de queijo',price:7}],
    orders:[{id:'o-demo-1',status:'DRAFT',items:[{id:'i1',name:'Café expresso',quantity:2,unit_price:5.5,modifiers:[]}]}],
    clients:[{id:'cl1',name:'Cliente demonstrativo',identity:'PROVISIONAL'}],
    whatsapp:{health:'UNKNOWN',connection:'UNKNOWN',qr:null,me:null,lastError:null,messageCount:0,messages:[],sse:'DISCONNECTED',loading:false,error:null,selectedJid:null}
  };
  const main=document.querySelector('#main'),title=document.querySelector('#page-title'),headerStatus=document.querySelector('#header-status'),sideStatus=document.querySelector('#side-wa-status');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
  const total=o=>o.items.reduce((s,i)=>s+i.quantity*i.unit_price,0);
  const fmtTime=ts=>{if(!ts)return '';const d=new Date(Number(ts)*1000);return Number.isNaN(d.getTime())?'':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
  function toast(text){const r=document.querySelector('#toast-root');r.innerHTML='<div class="toast" role="status">'+esc(text)+'</div>';setTimeout(()=>{if(r.innerHTML)r.innerHTML=''},3200)}
  function dialog(content){document.querySelector('#dialog-root').innerHTML='<div class="dialog-backdrop" role="presentation"><section class="dialog" role="dialog" aria-modal="true">'+content+'</section></div>';document.querySelector('.dialog-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeDialog()};setTimeout(()=>document.querySelector('.dialog button,.dialog input')?.focus(),0)}
  function closeDialog(){document.querySelector('#dialog-root').innerHTML=''}
  function badge(text,kind='unknown'){return '<span class="badge '+kind+'">'+esc(text)+'</span>'}
  function stateBanner(stateName,titleText,description){const kinds={READY:'ready',AVAILABLE:'confirmed',DEGRADED:'degraded',UNKNOWN:'unknown',UNAVAILABLE:'unavailable',ERROR:'unavailable',LOADING:'unknown',EMPTY:'unknown',NOT_IMPLEMENTED:'unavailable',CONFIGURATION_REQUIRED:'degraded'};return '<div class="card state-card" style="margin-bottom:16px">'+badge(stateName,kinds[stateName]||'unknown')+'<strong>'+esc(titleText)+'</strong><div class="muted">'+esc(description)+'</div></div>'}
  function updateChrome(){
    title.textContent=pages[state.page]||state.page;
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
    const c=state.whatsapp.connection,h=state.whatsapp.health,s=state.whatsapp.sse;
    headerStatus.textContent=`Gateway: ${h} • WhatsApp: ${c} • SSE: ${s}`;
    sideStatus.textContent=`WhatsApp: ${c} • SSE: ${s}`;
    const dot=document.querySelector('#header-dot');dot.style.background=c==='CONNECTED'?'var(--ok)':c==='ERROR'||c==='UNAVAILABLE'?'var(--danger)':c==='CONNECTING'?'var(--brand)':'var(--warn)';
  }
  function mergeMessage(message){
    if(!message||typeof message!=='object'||!message.id)return false;
    const id=String(message.id);const idx=state.whatsapp.messages.findIndex(m=>String(m.id)===id);
    if(idx>=0){state.whatsapp.messages[idx]={...state.whatsapp.messages[idx],...message};return false}
    state.whatsapp.messages.push({...message,id});state.whatsapp.messages.sort((a,b)=>Number(a.timestamp||0)-Number(b.timestamp||0));if(state.whatsapp.messages.length>500)state.whatsapp.messages=state.whatsapp.messages.slice(-500);return true;
  }
  function applyStatus(x){
    if(!x||typeof x!=='object')throw new Error('Status inválido');
    state.whatsapp.connection=typeof x.connection==='string'?x.connection:'UNKNOWN';state.whatsapp.qr=x.qr??null;state.whatsapp.me=x.me??null;state.whatsapp.lastError=x.lastError??null;state.whatsapp.messageCount=Number.isFinite(Number(x.messageCount))?Number(x.messageCount):0;updateChrome();
  }
  async function gatewayJson(path,options={}){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
    try{const response=await fetch(GATEWAY+path,{...options,signal:controller.signal,headers:{'content-type':'application/json',...(options.headers||{})}});const payload=await response.json().catch(()=>{throw new Error('Resposta inválida do Gateway')});if(!response.ok)throw new Error(typeof payload.error==='string'?payload.error:`Falha HTTP ${response.status}`);return payload}finally{clearTimeout(timer)}
  }
  let eventSource=null,eventReconnectTimer=null,eventReconnectAttempt=0,refreshInFlight=false;
  function closeEvents(){if(eventReconnectTimer)clearTimeout(eventReconnectTimer);eventReconnectTimer=null;if(eventSource){eventSource.onopen=null;eventSource.onerror=null;eventSource.close();eventSource=null}state.whatsapp.sse='DISCONNECTED';updateChrome()}
  function scheduleEvents(){if(eventReconnectTimer)return;const delay=Math.min(30000,1000*Math.pow(2,eventReconnectAttempt));eventReconnectAttempt=Math.min(eventReconnectAttempt+1,5);eventReconnectTimer=setTimeout(()=>{eventReconnectTimer=null;connectEvents()},delay)}
  function connectEvents(){if(eventSource||state.whatsapp.sse==='CONNECTING')return;state.whatsapp.sse='CONNECTING';updateChrome();eventSource=new EventSource(GATEWAY+'/api/whatsapp/events');eventSource.onopen=()=>{eventReconnectAttempt=0;state.whatsapp.sse='CONNECTED';updateChrome();render()};eventSource.onerror=()=>{state.whatsapp.sse='DISCONNECTED';updateChrome();if(eventSource){eventSource.close();eventSource=null}scheduleEvents();render()};for(const name of ['status','connection','message'])eventSource.addEventListener(name,event=>{try{const payload=JSON.parse(event.data||'{}');if(payload.status)applyStatus(payload.status);if(name==='message'){const accepted=mergeMessage(payload.message??payload);if(accepted)render()}else render()}catch(error){state.whatsapp.error=error instanceof Error?error.message:'Evento SSE inválido';render()}})}
  async function refreshWhatsApp(){
    if(refreshInFlight)return;refreshInFlight=true;state.whatsapp.loading=true;state.whatsapp.error=null;render();
    try{const health=await gatewayJson('/health');state.whatsapp.health=health&&health.ok?'HEALTHY':'UNKNOWN';applyStatus(await gatewayJson('/api/whatsapp/status'));const history=await gatewayJson('/api/whatsapp/messages?limit=500');state.whatsapp.messages=[];for(const message of Array.isArray(history.messages)?history.messages:[])mergeMessage(message);if(!state.whatsapp.selectedJid){const first=buildConversations()[0];state.whatsapp.selectedJid=first?.jid??null}}
    catch(error){state.whatsapp.health='UNAVAILABLE';state.whatsapp.connection='UNAVAILABLE';state.whatsapp.sse='DISCONNECTED';state.whatsapp.error=error instanceof Error?error.message:'Gateway indisponível'}
    finally{state.whatsapp.loading=false;refreshInFlight=false;updateChrome();render()}
  }
  function connectOrRefresh(){connectEvents();refreshWhatsApp()}
  function buildConversations(){const map=new Map();for(const m of state.whatsapp.messages){const jid=typeof m.jid==='string'?m.jid:null;if(!jid)continue;const current=map.get(jid);if(!current||Number(m.timestamp||0)>=Number(current.lastMessage?.timestamp||0))map.set(jid,{jid,lastMessage:m})}return [...map.values()].sort((a,b)=>Number(b.lastMessage?.timestamp||0)-Number(a.lastMessage?.timestamp||0))}
  function jidLabel(jid){if(!jid)return 'Identidade indisponível';if(jid.endsWith('@lid'))return 'LID • '+jid.slice(0,-4);if(jid.endsWith('@s.whatsapp.net'))return jid.slice(0,-13);return jid}
  function currentConversation(){return state.whatsapp.selectedJid?buildConversations().find(c=>c.jid===state.whatsapp.selectedJid)||null:null}
  function renderDashboard(){return '<div class="toolbar"><div><h2 style="margin:0">Operação</h2><p class="muted" style="margin:6px 0 0">Visão consolidada das superfícies do Desktop, sem inferir sucesso operacional.</p></div>'+badge('READY','ready')+'</div><div class="kpi-grid"><section class="card metric"><span class="muted">Gateway</span><b>'+esc(state.whatsapp.health)+'</b></section><section class="card metric"><span class="muted">WhatsApp</span><b>'+esc(state.whatsapp.connection)+'</b></section><section class="card metric"><span class="muted">SSE</span><b>'+esc(state.whatsapp.sse)+'</b></section><section class="card metric"><span class="muted">Conversas reais</span><b>'+buildConversations().length+'</b></section></div><section class="card" style="margin-top:16px"><div class="section-title"><div><h3>Status da integração</h3><p class="muted" style="margin:5px 0 0">Gateway health, conexão do canal, SSE e delivery permanecem estados distintos.</p></div></div><div class="status-legend">'+badge('Gateway '+state.whatsapp.health,state.whatsapp.health==='HEALTHY'?'confirmed':state.whatsapp.health==='UNAVAILABLE'?'unavailable':'unknown')+badge('WhatsApp '+state.whatsapp.connection,state.whatsapp.connection==='CONNECTED'?'confirmed':state.whatsapp.connection==='UNAVAILABLE'?'unavailable':'unknown')+badge('SSE '+state.whatsapp.sse,state.whatsapp.sse==='CONNECTED'?'confirmed':state.whatsapp.sse==='DISCONNECTED'?'unknown':'degraded')+badge('Delivery UNKNOWN','unknown')+'</div><div class="row-actions" style="margin-top:16px"><button class="btn primary" data-go="whatsapp">Abrir Conversas</button><button class="btn" data-go="assistant">Abrir Assistente</button><button class="btn" data-go="settings">Abrir Configurações</button></div></section></div>'}
  function renderWhatsApp(){
    const wa=state.whatsapp,conversations=buildConversations(),selected=currentConversation(),selectedMessages=selected?wa.messages.filter(m=>m.jid===selected.jid):[],connection=wa.connection,canSend=connection==='CONNECTED'&&!!selected?.jid,account=wa.me?.id?jidLabel(wa.me.id):'Identidade indisponível';
    if(wa.loading)return stateBanner('LOADING','Carregando Conversas','Consultando health, status e histórico no Gateway real.')+'<section class="card"><div class="empty">Aguardando resposta das interfaces atuais do Gateway.</div></section>';
    const qr=wa.qr&&connection==='PAIRING'?'<section class="card" style="margin-bottom:16px"><div class="section-title"><div><h3>Emparelhamento</h3><p class="muted">QR fornecido pelo Gateway real.</p></div>'+badge('PAIRING','degraded')+'</div><textarea class="qr mono" readonly aria-label="QR fornecido pelo Gateway">'+esc(wa.qr)+'</textarea></section>':'';
    return '<div class="toolbar"><div><div class="inline-status">'+badge(connection,connection==='CONNECTED'?'confirmed':connection==='UNAVAILABLE'||connection==='ERROR'?'unavailable':'unknown')+badge('Gateway '+wa.health,wa.health==='HEALTHY'?'confirmed':wa.health==='UNAVAILABLE'?'unavailable':'unknown')+badge('SSE '+wa.sse,wa.sse==='CONNECTED'?'confirmed':wa.sse==='DISCONNECTED'?'unknown':'degraded')+'</div><p class="muted" style="margin:8px 0 0">Fonte operacional: Gateway real em 127.0.0.1:3210.</p></div><div><button class="btn primary" id="wa-connect">Atualizar</button> <button class="btn" id="wa-logout">Desconectar</button> <button class="btn danger" id="wa-reset">Resetar sessão</button></div></div>'+(wa.error?'<div class="notice error" style="margin-bottom:16px">'+esc(wa.error)+'</div>':'')+'<div class="grid three" style="margin-bottom:16px"><section class="card metric"><span class="muted">Conta</span><b>'+esc(account)+'</b></section><section class="card metric"><span class="muted">Histórico em memória</span><b>'+esc(wa.messageCount)+'</b></section><section class="card metric"><span class="muted">Customer relation</span><b>UNAVAILABLE</b></section></div>'+qr+'<section class="card" style="padding:0;overflow:hidden"><div class="split"><aside class="list"><div class="list-header"><div class="row-top"><strong>Conversas reais</strong><span class="badge">'+conversations.length+'</span></div><p class="muted" style="margin:6px 0 0">Derivadas das mensagens disponíveis no Gateway.</p></div>'+(conversations.length?conversations.map(c=>{const active=c.jid===wa.selectedJid,m=c.lastMessage;return '<button class="conversation-row '+(active?'active':'')+'" data-jid="'+esc(c.jid)+'"><div class="row-top"><span class="row-name">'+esc(jidLabel(c.jid))+'</span><span class="row-time">'+esc(fmtTime(m.timestamp))+'</span></div><div class="row-preview">'+esc(m.text??'[sem texto]')+'</div></button>'}).join(''):'<div class="empty">Nenhuma conversa disponível na fonte real.</div>')+'</aside><section class="conversation"><header class="conversation-header"><div><strong>'+esc(selected?jidLabel(selected.jid):'Selecione uma conversa')+'</strong><div class="muted mono" style="margin-top:4px">'+esc(selected?.jid||'')+'</div></div><div class="inline-status">'+badge(selected?'JID REAL':'SEM SELEÇÃO','unknown')+(selected?.lastMessage?badge('Última: '+fmtTime(selected.lastMessage.timestamp),'unknown'):'')+'</div></header><div class="messages">'+(selectedMessages.length?selectedMessages.map(m=>'<div class="msg '+(m.direction==='OUTBOUND'?'out':'')+'"><div>'+esc(m.text??'[mensagem sem texto suportado]')+'</div><div class="msg-meta"><span>'+esc(m.direction)+'</span><span>'+esc(m.status)+'</span><span>'+esc(fmtTime(m.timestamp))+'</span></div></div>').join(''):'<div class="empty">Selecione uma conversa para ver as mensagens reais.</div>')+'</div><div class="workspace-note" style="margin:0 20px 14px">Histórico limitado à memória do Gateway. @lid é exibido como LID e não é convertido em telefone. Delivery/read continuam UNKNOWN.</div><form class="composer" id="wa-composer"><input id="wa-text" aria-label="Mensagem" placeholder="Mensagem" autocomplete="off" '+(canSend?'':'disabled')+' /><button class="btn primary" type="submit" '+(canSend?'':'disabled')+'>'+ (canSend?'Enviar':'Enviar indisponível') +'</button></form></section></div></section><section class="card" style="margin-top:16px"><h3 style="margin-top:0">Diagnostics</h3><div class="diagnostic-grid"><div class="diagnostic"><span class="muted">Gateway</span><b>'+esc(wa.health)+'</b></div><div class="diagnostic"><span class="muted">WhatsApp</span><b>'+esc(connection)+'</b></div><div class="diagnostic"><span class="muted">SSE</span><b>'+esc(wa.sse)+'</b></div><div class="diagnostic"><span class="muted">Deduplicação</span><b>message.id</b></div></div></section>'
  }
  function renderAssistant(){return stateBanner('UNAVAILABLE','Assistente sem fonte operacional configurada','A superfície está pronta, mas nenhum contrato renderer-exposto foi localizado para declarar provider/modelo, perfil ativo ou controles persistentes.')+'<div class="grid two"><section class="card"><div class="section-title"><div><h3>Status do Assistente</h3><p class="muted">Não inferido a partir da presença da UI.</p></div>'+badge('UNKNOWN','unknown')+'</div><table><tbody><tr><th>Disponibilidade</th><td>UNKNOWN</td></tr><tr><th>Provider/modelo</th><td>UNKNOWN</td></tr><tr><th>Última atualização</th><td>UNKNOWN</td></tr></tbody></table></section><section class="card"><div class="section-title"><div><h3>Perfil ativo</h3><p class="muted">Somente dados de AIProfile existentes podem preencher estes campos.</p></div>'+badge('UNAVAILABLE','unavailable')+'</div><table><tbody><tr><th>Perfil</th><td>UNAVAILABLE</td></tr><tr><th>Estado</th><td>UNAVAILABLE</td></tr><tr><th>Fallback</th><td>UNAVAILABLE</td></tr></tbody></table></section><section class="card"><div class="section-title"><div><h3>Comportamento</h3><p class="muted">Controles persistentes não são criados nesta superfície.</p></div>'+badge('NOT_IMPLEMENTED','unavailable')+'</div><div class="checklist"><div class="check"><input type="checkbox" disabled aria-label="Instruções persistentes indisponíveis" /><span>Instruções/contexto — indisponível</span></div><div class="check"><input type="checkbox" disabled aria-label="Autonomia operacional indisponível" /><span>Autonomia operacional — indisponível</span></div><div class="check"><input type="checkbox" disabled aria-label="Handoff humano indisponível" /><span>Handoff humano — indisponível</span></div></div></section><section class="card"><div class="section-title"><div><h3>Segurança</h3><p class="muted">Tool authorization e contexto confiável não são inferidos pelo renderer.</p></div>'+badge('UNKNOWN','unknown')+'</div><table><tbody><tr><th>Tool authorization</th><td>UNKNOWN</td></tr><tr><th>Contexto confiável</th><td>UNKNOWN</td></tr><tr><th>Proteção contra ação não autorizada</th><td>UNKNOWN</td></tr></tbody></table></section><section class="card" style="grid-column:1/-1"><div class="section-title"><div><h3>Diagnóstico</h3><p class="muted">Sem provider/runtime expostos pelo contrato atual.</p></div></div><div class="grid four"><div class="diagnostic"><span class="muted">Último erro</span><b>UNKNOWN</b></div><div class="diagnostic"><span class="muted">Provider</span><b>UNKNOWN</b></div><div class="diagnostic"><span class="muted">Latência</span><b>UNKNOWN</b></div><div class="diagnostic"><span class="muted">Fallback</span><b>UNKNOWN</b></div></div></section></div>'}
  function renderBroadcasts(){return '<div class="toolbar"><div><h2 style="margin:0">Disparos</h2><p class="muted" style="margin:6px 0 0">Preparação e acompanhamento só aparecem como operacionais quando houver fonte e contrato reais.</p></div>'+badge('UNAVAILABLE','unavailable')+'</div>'+stateBanner('UNAVAILABLE','Backend de disparos não disponível','Nenhuma API/contrato de campanha foi identificado nesta linhagem. A UI não simula criação, agendamento ou envio.')+'<div class="kpi-grid"><section class="card metric"><span class="muted">Campanhas</span><b>UNAVAILABLE</b></section><section class="card metric"><span class="muted">Em andamento</span><b>UNAVAILABLE</b></section><section class="card metric"><span class="muted">Concluídas</span><b>UNAVAILABLE</b></section><section class="card metric"><span class="muted">Falhas</span><b>UNAVAILABLE</b></section></div><div class="grid two" style="margin-top:16px"><section class="card"><div class="section-title"><div><h3>Novo disparo</h3><p class="muted">Campos mantidos desabilitados para não sugerir persistência ou envio real.</p></div>'+badge('NOT_IMPLEMENTED','unavailable')+'</div><div class="field"><label for="broadcast-name">Nome/título</label><input id="broadcast-name" disabled placeholder="Disponível quando houver contrato" /></div><div class="field"><label for="broadcast-audience">Público/destinatários</label><select id="broadcast-audience" disabled><option>Fonte de público indisponível</option></select></div><div class="field"><label for="broadcast-content">Conteúdo</label><textarea id="broadcast-content" disabled rows="5" placeholder="Conteúdo indisponível sem integração de disparos"></textarea></div><div class="field"><label for="broadcast-schedule">Agendamento</label><input id="broadcast-schedule" disabled type="datetime-local" /></div><div class="row-actions"><button class="btn primary" disabled>Revisar antes do envio</button><button class="btn danger" disabled>Confirmar envio</button></div></section><section class="card"><div class="section-title"><div><h3>Segmentação</h3><p class="muted">Clientes, grupos, tags e estimativa só podem usar fontes reais.</p></div></div><table><tbody><tr><th>Clientes</th><td>UNAVAILABLE</td></tr><tr><th>Grupos</th><td>UNAVAILABLE</td></tr><tr><th>Tags/segmentos</th><td>UNAVAILABLE</td></tr><tr><th>Destinatários estimados</th><td>UNAVAILABLE</td></tr></tbody></table><div class="notice info" style="margin-top:16px">Não há ação local que represente envio. Um clique não pode ser tratado como SENT/DELIVERED.</div></section><section class="card" style="grid-column:1/-1"><div class="section-title"><div><h3>Histórico</h3><p class="muted">Sem fonte real, não existe histórico operacional a exibir.</p></div>'+badge('EMPTY','unknown')+'</div><div class="hero-empty"><div><strong>Nenhum disparo disponível</strong><div class="muted">O histórico permanecerá vazio até que a integração correspondente exista.</div></div></div></section></div>'}
  function renderGroups(){const filter=state.groupFilter.trim().toLowerCase();return '<div class="toolbar"><div><h2 style="margin:0">Grupos</h2><p class="muted" style="margin:6px 0 0">Área preparada para fonte real de grupos/coletivos.</p></div>'+badge('UNAVAILABLE','unavailable')+'</div><div class="card" style="margin-bottom:16px"><div class="list-filter"><label for="group-filter">Buscar</label><input id="group-filter" value="'+esc(state.groupFilter)+'" placeholder="Nome do grupo" autocomplete="off" /><button class="btn" id="group-clear">Limpar</button></div></div>'+stateBanner('UNAVAILABLE','Fonte de grupos não exposta pelo Gateway','Não criar grupos fictícios nem inventar semântica de Group no domínio.')+'<div class="grid two"><section class="card"><div class="section-title"><div><h3>Lista de grupos</h3><p class="muted">Nome, status, participantes e última atividade dependem de dados reais.</p></div></div><div class="hero-empty"><div><strong>Lista indisponível</strong><div class="muted">'+(filter?'Nenhuma fonte pesquisável para o filtro “'+esc(filter)+'”.':'Nenhum grupo disponível na fonte atual.')+'</div></div></div></section><section class="card"><div class="section-title"><div><h3>Detalhes</h3><p class="muted">Ações de abertura/participantes ficam condicionadas ao contrato.</p></div></div><table><tbody><tr><th>Informações</th><td>UNAVAILABLE</td></tr><tr><th>Participantes</th><td>UNAVAILABLE</td></tr><tr><th>Atividade</th><td>UNAVAILABLE</td></tr><tr><th>Canal/provider</th><td>UNAVAILABLE</td></tr></tbody></table><div class="row-actions" style="margin-top:16px"><button class="btn primary" disabled>Abrir conversa</button><button class="btn" disabled>Ver participantes</button></div></section></div>'}
  function renderOrders(){return '<div class="toolbar"><div><span class="badge provisional">PROVISIONAL_DATA</span><p class="muted">UiOrder permanece presentation-only neste slice.</p></div></div><section class="card"><table><thead><tr><th>ID</th><th>Status</th><th>Total apresentado</th></tr></thead><tbody>'+state.orders.map(o=>'<tr><td>'+esc(o.id)+'</td><td>'+esc(o.status)+'</td><td>'+money(total(o))+'</td></tr>').join('')+'</tbody></table></section>'}
  function renderProducts(){return '<div class="toolbar"><div><span class="badge provisional">PROVISIONAL_DATA</span><p class="muted">Fixtures locais descartáveis.</p></div></div><section class="card"><table><thead><tr><th>Nome</th><th>Preço</th></tr></thead><tbody>'+state.products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+money(p.price)+'</td></tr>').join('')+'</tbody></table></section>'}
  function renderClients(){return '<div class="toolbar"><span class="badge provisional">PROVISIONAL_DATA</span></div><section class="card"><table><thead><tr><th>Nome</th><th>Identidade</th></tr></thead><tbody>'+state.clients.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.identity)+'</td></tr>').join('')+'</tbody></table><div class="notice" style="margin-top:16px">CRM e relação Customer ↔ WhatsApp Conversation ainda não fazem parte deste slice.</div></section>'}
  function renderSettings(){
    const s=state.settingsSection,w=state.whatsapp;
    const content={
      'Geral':'<section class="card"><div class="section-title"><div><h3>Geral</h3><p class="muted">Preferências locais suportadas pela superfície atual.</p></div>'+badge('READY','ready')+'</div><div class="grid two"><div class="field"><label for="language">Idioma</label><select id="language"><option>Português (Brasil)</option></select></div><div class="field"><label for="appearance">Aparência</label><select id="appearance"><option>Sistema</option></select></div></div><div class="workspace-note">Identificação da loja e outras preferências persistentes permanecem ocultas quando não há contrato correspondente.</div></section>',
      'WhatsApp':'<section class="card"><div class="section-title"><div><h3>WhatsApp / Conexão</h3><p class="muted">Canal/provider contextual. Não é categoria da navegação principal.</p></div>'+badge(w.connection,w.connection==='CONNECTED'?'confirmed':w.connection==='UNAVAILABLE'?'unavailable':'unknown')+'</div><div class="grid four"><div class="diagnostic"><span class="muted">Provider</span><b>WhatsApp</b></div><div class="diagnostic"><span class="muted">Conexão</span><b>'+esc(w.connection)+'</b></div><div class="diagnostic"><span class="muted">SSE</span><b>'+esc(w.sse)+'</b></div><div class="diagnostic"><span class="muted">Conta</span><b>'+esc(w.me?.id?jidLabel(w.me.id):'UNKNOWN')+'</b></div></div><div class="row-actions" style="margin-top:16px"><button class="btn primary" data-go="whatsapp">Abrir Conversas</button></div></section>',
      'Assistente IA':'<section class="card"><div class="section-title"><div><h3>Assistente IA</h3><p class="muted">Estado baseado somente em interfaces existentes.</p></div>'+badge('UNKNOWN','unknown')+'</div><table><tbody><tr><th>Perfil ativo</th><td>UNAVAILABLE</td></tr><tr><th>Provider/modelo</th><td>UNKNOWN</td></tr><tr><th>Fallback</th><td>UNKNOWN</td></tr><tr><th>Disponibilidade</th><td>UNKNOWN</td></tr></tbody></table><div class="notice info" style="margin-top:16px">Nenhuma configuração persistente nova foi criada; não existe AssistantConfig neste slice.</div></section>',
      'Operação':'<section class="card"><div class="section-title"><div><h3>Operação</h3><p class="muted">Preferências e limites somente quando já suportados.</p></div>'+badge('UNAVAILABLE','unavailable')+'</div><div class="hero-empty"><div><strong>Preferências operacionais não expostas</strong><div class="muted">Não inventar notificações, limites ou estados adicionais sem contrato.</div></div></div></section>',
      'Segurança':'<section class="card"><div class="section-title"><div><h3>Segurança</h3><p class="muted">Estado das proteções e permissões sem expor segredos.</p></div>'+badge('UNKNOWN','unknown')+'</div><table><tbody><tr><th>Sessão local</th><td>UNKNOWN</td></tr><tr><th>Permissões</th><td>UNKNOWN</td></tr><tr><th>Tool authorization</th><td>UNKNOWN</td></tr><tr><th>Proteções</th><td>UNKNOWN</td></tr></tbody></table></section>',
      'Dados e Privacidade':'<section class="card"><div class="section-title"><div><h3>Dados e Privacidade</h3><p class="muted">Somente controles já contratados são exibidos.</p></div>'+badge('UNAVAILABLE','unavailable')+'</div><table><tbody><tr><th>Armazenamento local</th><td>UNKNOWN</td></tr><tr><th>Retenção</th><td>UNAVAILABLE</td></tr><tr><th>Dados pessoais tratados</th><td>UNKNOWN</td></tr><tr><th>Exportação/remoção</th><td>UNAVAILABLE</td></tr></tbody></table></section>',
      'Diagnóstico':'<section class="card"><div class="section-title"><div><h3>Diagnóstico</h3><p class="muted">Estados independentes das integrações atuais.</p></div></div><div class="diagnostic-grid"><div class="diagnostic"><span class="muted">Version/build</span><b>UNKNOWN</b></div><div class="diagnostic"><span class="muted">Gateway</span><b>'+esc(w.health)+'</b></div><div class="diagnostic"><span class="muted">WhatsApp</span><b>'+esc(w.connection)+'</b></div><div class="diagnostic"><span class="muted">SSE</span><b>'+esc(w.sse)+'</b></div><div class="diagnostic"><span class="muted">Persistence</span><b>UNKNOWN</b></div><div class="diagnostic"><span class="muted">Delivery</span><b>UNKNOWN</b></div><div class="diagnostic"><span class="muted">Erros recentes</span><b>'+esc(w.error||'UNKNOWN')+'</b></div></div></section>',
      'Sobre':'<section class="card"><div class="section-title"><div><h3>Sobre / Sistema</h3><p class="muted">Informações disponíveis no renderer atual.</p></div>'+badge('READY','ready')+'</div><table><tbody><tr><th>Produto</th><td>KassisT Desktop</td></tr><tr><th>Ambiente</th><td>Electron / Desktop</td></tr><tr><th>Versão</th><td>UNKNOWN</td></tr><tr><th>Build SHA</th><td>UNKNOWN</td></tr></tbody></table></section>'
    }[s]||'';
    return '<div class="toolbar"><div><h2 style="margin:0">Configurações</h2><p class="muted" style="margin:6px 0 0">Configurações agrupadas por responsabilidade, com estados operacionais explícitos.</p></div></div><div class="tab-list" role="tablist" aria-label="Categorias de configurações">'+settingsSections.map(name=>'<button class="tab-button" role="tab" aria-selected="'+(name===s?'true':'false')+'" data-settings-section="'+esc(name)+'">'+esc(name)+'</button>').join('')+'</div><div class="settings-content">'+content+'</div>'
  }
  function bindWhatsApp(){
    document.querySelector('#wa-connect')?.addEventListener('click',()=>connectOrRefresh());
    document.querySelector('#wa-logout')?.addEventListener('click',async()=>{try{await gatewayJson('/api/whatsapp/logout',{method:'POST',body:'{}'});toast('Logout solicitado ao Gateway.');await refreshWhatsApp()}catch(e){state.whatsapp.error=e instanceof Error?e.message:'Falha no logout';render()}});
    document.querySelector('#wa-reset')?.addEventListener('click',()=>dialog('<h2>Resetar sessão?</h2><p>Esta ação limpa a sessão persistida do Gateway e pode exigir novo QR.</p><button class="btn danger" id="confirm-reset">Resetar sessão</button> <button class="btn" id="cancel-reset">Cancelar</button>'));
    document.querySelector('#confirm-reset')?.addEventListener('click',async()=>{closeDialog();try{await gatewayJson('/api/whatsapp/reset-session',{method:'POST',body:'{}'});toast('Sessão resetada no Gateway.');await refreshWhatsApp()}catch(e){state.whatsapp.error=e instanceof Error?e.message:'Falha ao resetar';render()}});
    document.querySelector('#cancel-reset')?.addEventListener('click',closeDialog);
    document.querySelectorAll('[data-jid]').forEach(button=>button.addEventListener('click',()=>{state.whatsapp.selectedJid=button.dataset.jid||null;render();setTimeout(()=>document.querySelector('.messages')?.scrollTo(0,999999),0)}));
    document.querySelector('#wa-composer')?.addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#wa-text');const text=input?.value?.trim()||'';const selected=currentConversation();if(!text||!selected?.jid||state.whatsapp.connection!=='CONNECTED')return;const button=event.submitter;button.disabled=true;try{await gatewayJson('/api/whatsapp/messages',{method:'POST',body:JSON.stringify({to:selected.jid,text})});input.value='';toast('Mensagem aceita pelo Gateway; aguardando evento SSE.')}catch(e){state.whatsapp.error=e instanceof Error?e.message:'Falha no envio';toast(state.whatsapp.error)}finally{button.disabled=false;render()}})
  }
  function bindGroups(){document.querySelector('#group-filter')?.addEventListener('input',event=>{state.groupFilter=event.target.value||'';render()});document.querySelector('#group-clear')?.addEventListener('click',()=>{state.groupFilter='';render()})}
  function bindSettings(){document.querySelectorAll('[data-settings-section]').forEach(button=>button.addEventListener('click',()=>{state.settingsSection=button.dataset.settingsSection||'Geral';render()}))}
  function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.go;render()}));if(state.page==='whatsapp')bindWhatsApp();if(state.page==='groups')bindGroups();if(state.page==='settings')bindSettings()}
  function render(){updateChrome();const renderer={dashboard:renderDashboard,whatsapp:renderWhatsApp,assistant:renderAssistant,broadcasts:renderBroadcasts,groups:renderGroups,orders:renderOrders,products:renderProducts,clients:renderClients,settings:renderSettings}[state.page]||renderDashboard;main.innerHTML=renderer();main.focus();bind()}
  document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{state.page=button.dataset.page;render();if(state.page==='whatsapp')connectOrRefresh()}));
  connectEvents();refreshWhatsApp();render();
})();
</script>
</body>
</html>
