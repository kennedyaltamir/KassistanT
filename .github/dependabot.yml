version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    package-manager: pnpm
    versioning-strategy: increase
    schedule:
      interval: weekly
    groups:
      production-and-tooling:
        patterns:
          - "*"
