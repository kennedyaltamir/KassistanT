name: Bootstrap Validation

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - Bootstrap Lockfile
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-validation-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  validate-bootstrap:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'bootstrap/dependency-determinism') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
