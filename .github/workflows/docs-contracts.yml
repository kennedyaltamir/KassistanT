name: Documentation Contracts

on:
  pull_request:
    paths:
      - 'docs/protocols/**'
      - 'docs/domain/**'
      - 'docs/backend/**'
      - 'docs/integrations/**'
      - 'scripts/validate-contracts.mjs'
      - '.github/workflows/docs-contracts.yml'

permissions:
  contents: read

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Validate documentation route invariants
        run: node scripts/validate-contracts.mjs
      - name: Validate OpenAPI with Redocly
        run: npx --yes @redocly/cli@1.34.6 lint --skip-rule=security-defined --skip-rule=info-license docs/protocols/openapi.yaml
