name: LLM Settings E2E Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop tests
        run: pnpm --filter @kassist/desktop test

      - name: Gateway tests
        run: pnpm --filter @kassist/gateway test

      - name: Workspace lint
        run: pnpm -r lint

      - name: Real Electron Settings UI verification
        run: pnpm --filter @kassist/desktop exec electron electron/verify-llm-settings-ui.cjs

      - name: Upload Settings UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-settings-ui-screenshot
          path: TESTES/RESULTADOS/llm-settings-ui.png
          if-no-files-found: error
