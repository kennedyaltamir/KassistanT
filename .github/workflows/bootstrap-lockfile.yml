name: Bootstrap Lockfile

on:
  push:
    branches:
      - bootstrap/dependency-determinism
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bootstrap/dependency-determinism

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconcile lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          test -f pnpm-lock.yaml
          git diff --check

      - name: Persist lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore(ci): reconcile deterministic pnpm lockfile"
          git push origin HEAD:bootstrap/dependency-determinism
