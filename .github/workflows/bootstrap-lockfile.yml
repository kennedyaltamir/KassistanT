name: Bootstrap Lockfile

on:
  push:
    branches:
      - m5-1-sqlite-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Reconcile lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          test -f pnpm-lock.yaml
          git diff --check

      - name: Persist lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore(ci): reconcile deterministic pnpm lockfile"
          git push origin HEAD:${{ github.ref_name }}
