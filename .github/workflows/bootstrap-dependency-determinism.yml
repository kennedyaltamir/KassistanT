name: Bootstrap Dependency Determinism

on:
  push:
    branches:
      - bootstrap/dependency-determinism
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile when absent
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f pnpm-lock.yaml ]]; then
            pnpm install --lockfile-only
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Validate workspace
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit generated lockfile
        if: github.event_name == 'push' && steps.lockfile.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore(ci): generate deterministic pnpm lockfile"
          git push origin HEAD:bootstrap/dependency-determinism
