name: Bootstrap Dependency Determinism

on:
  push:
    branches:
      - bootstrap/dependency-determinism
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/bootstrap/dependency-determinism'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bootstrap/dependency-determinism

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile when absent
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f pnpm-lock.yaml ]]; then
            pnpm install --lockfile-only
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          git diff --check

      - name: Persist generated lockfile
        if: steps.lockfile.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore(ci): generate deterministic pnpm lockfile"
          git push origin HEAD:bootstrap/dependency-determinism

  validate-bootstrap:
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/bootstrap/dependency-determinism') || github.event_name == 'workflow_dispatch') }}
    needs: generate-lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
